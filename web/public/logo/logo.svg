<svg width="100" height="40" viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .assistant-text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 700; }
    </style>
  </defs>
  <!-- antenna ball -->
  <circle cx="17" cy="10" r="4" fill="#0033FF"/>
  <!-- antenna stick -->
  <rect x="15" y="13" width="4" height="5" rx="2" fill="#0033FF"/>
  <!-- robot head -->
  <rect x="7" y="17" width="20" height="18" rx="5.5" fill="#0033FF"/>
  <!-- eyes -->
  <circle cx="12" cy="24" r="1.8" fill="#FFFFFF"/>
  <circle cx="22" cy="24" r="1.8" fill="#FFFFFF"/>
  <!-- mouth -->
  <rect x="12" y="29.5" width="10" height="2" rx="1" fill="#FFFFFF"/>
  <text x="34" y="30" class="assistant-text" font-size="17" fill="#111827">智能助手</text>
</svg>
